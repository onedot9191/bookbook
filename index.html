<!DOCTYPE html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026 대구 미래역량 교육</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png?v=2" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Premium Font Stack: Pretendard for Korean, Plus Jakarta Sans for English -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Pretendard Variable"', '"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', '"Pretendard Variable"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              border: 'var(--border)',
              input: 'var(--input)',
              ring: 'var(--ring)',
              background: 'var(--background)',
              foreground: 'var(--foreground)',
              primary: {
                DEFAULT: 'var(--primary)',
                foreground: 'var(--primary-foreground)',
              },
              secondary: {
                DEFAULT: 'var(--secondary)',
                foreground: 'var(--secondary-foreground)',
              },
              destructive: {
                DEFAULT: 'var(--destructive)',
                foreground: 'var(--destructive-foreground)',
              },
              muted: {
                DEFAULT: 'var(--muted)',
                foreground: 'var(--muted-foreground)',
              },
              accent: {
                DEFAULT: 'var(--accent)',
                foreground: 'var(--accent-foreground)',
              },
              popover: {
                DEFAULT: 'var(--popover)',
                foreground: 'var(--popover-foreground)',
              },
              card: {
                DEFAULT: 'var(--card)',
                foreground: 'var(--card-foreground)',
              },
              sidebar: {
                DEFAULT: 'var(--sidebar)',
                foreground: 'var(--sidebar-foreground)',
                primary: 'var(--sidebar-primary)',
                'primary-foreground': 'var(--sidebar-primary-foreground)',
                accent: 'var(--sidebar-accent)',
                'accent-foreground': 'var(--sidebar-accent-foreground)',
                border: 'var(--sidebar-border)',
                ring: 'var(--sidebar-ring)',
              },
            },
            borderRadius: {
              lg: 'var(--radius)',
              md: 'calc(var(--radius) - 2px)',
              sm: 'calc(var(--radius) - 4px)',
            },
            boxShadow: {
              '2xs': 'var(--shadow-2xs)',
              'xs': 'var(--shadow-xs)',
              'sm': 'var(--shadow-sm)',
              DEFAULT: 'var(--shadow)',
              'md': 'var(--shadow-md)',
              'lg': 'var(--shadow-lg)',
              'xl': 'var(--shadow-xl)',
              '2xl': 'var(--shadow-2xl)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Light Theme - Warm Cream & Rose Accent */
        --background: oklch(0.975 0.008 60);
        --foreground: oklch(0.25 0.02 260);
        --card: oklch(0.995 0.003 90);
        --card-foreground: oklch(0.25 0.02 260);
        --popover: oklch(0.995 0.003 90);
        --popover-foreground: oklch(0.25 0.02 260);
        --primary: oklch(0.58 0.22 350);
        --primary-foreground: oklch(0.99 0.005 90);
        --secondary: oklch(0.92 0.03 240);
        --secondary-foreground: oklch(0.3 0.02 260);
        --muted: oklch(0.94 0.015 260);
        --muted-foreground: oklch(0.55 0.02 260);
        --accent: oklch(0.88 0.08 85);
        --accent-foreground: oklch(0.3 0.02 260);
        --destructive: oklch(0.6 0.22 25);
        --destructive-foreground: oklch(0.99 0.005 90);
        --border: oklch(0.88 0.02 260);
        --input: oklch(0.97 0.005 90);
        --ring: oklch(0.58 0.22 350);
        --radius: 0.75rem;
        
        /* Modern Soft Shadows - Light Mode */
        --shadow-2xs: 0 1px 2px -1px oklch(0.3 0.02 260 / 0.08);
        --shadow-xs: 0 2px 4px -1px oklch(0.3 0.02 260 / 0.1);
        --shadow-sm: 0 3px 8px -2px oklch(0.3 0.02 260 / 0.12), 0 1px 3px -1px oklch(0.3 0.02 260 / 0.08);
        --shadow: 0 6px 16px -4px oklch(0.3 0.02 260 / 0.14), 0 2px 6px -2px oklch(0.3 0.02 260 / 0.1);
        --shadow-md: 0 10px 24px -6px oklch(0.3 0.02 260 / 0.16), 0 4px 10px -3px oklch(0.3 0.02 260 / 0.1);
        --shadow-lg: 0 16px 40px -8px oklch(0.3 0.02 260 / 0.18), 0 6px 16px -4px oklch(0.3 0.02 260 / 0.1);
        --shadow-xl: 0 24px 60px -12px oklch(0.3 0.02 260 / 0.22), 0 10px 24px -6px oklch(0.3 0.02 260 / 0.12);
        --shadow-2xl: 0 32px 80px -16px oklch(0.3 0.02 260 / 0.28);
        --shadow-glow: 0 0 20px -5px oklch(0.58 0.22 350 / 0.4);
      }

      .dark {
        /* Dark Theme - Deep Navy & Warm Gold Accent */
        --background: oklch(0.16 0.025 260);
        --foreground: oklch(0.94 0.015 60);
        --card: oklch(0.2 0.025 260);
        --card-foreground: oklch(0.94 0.015 60);
        --popover: oklch(0.22 0.025 260);
        --popover-foreground: oklch(0.94 0.015 60);
        --primary: oklch(0.82 0.12 85);
        --primary-foreground: oklch(0.16 0.025 260);
        --secondary: oklch(0.72 0.12 10);
        --secondary-foreground: oklch(0.16 0.025 260);
        --muted: oklch(0.26 0.02 260);
        --muted-foreground: oklch(0.65 0.03 60);
        --accent: oklch(0.6 0.14 350);
        --accent-foreground: oklch(0.94 0.015 60);
        --destructive: oklch(0.6 0.2 25);
        --destructive-foreground: oklch(0.94 0.015 60);
        --border: oklch(0.32 0.025 260);
        --input: oklch(0.97 0.005 90);
        --ring: oklch(0.82 0.12 85);
        
        /* Modern Soft Shadows - Dark Mode */
        --shadow-2xs: 0 1px 2px -1px oklch(0 0 0 / 0.3);
        --shadow-xs: 0 2px 4px -1px oklch(0 0 0 / 0.35);
        --shadow-sm: 0 3px 8px -2px oklch(0 0 0 / 0.4), 0 1px 3px -1px oklch(0 0 0 / 0.3);
        --shadow: 0 6px 16px -4px oklch(0 0 0 / 0.45), 0 2px 6px -2px oklch(0 0 0 / 0.35);
        --shadow-md: 0 10px 24px -6px oklch(0 0 0 / 0.5), 0 4px 10px -3px oklch(0 0 0 / 0.35);
        --shadow-lg: 0 16px 40px -8px oklch(0 0 0 / 0.55), 0 6px 16px -4px oklch(0 0 0 / 0.4);
        --shadow-xl: 0 24px 60px -12px oklch(0 0 0 / 0.6), 0 10px 24px -6px oklch(0 0 0 / 0.45);
        --shadow-2xl: 0 32px 80px -16px oklch(0 0 0 / 0.7);
        --shadow-glow: 0 0 30px -5px oklch(0.82 0.12 85 / 0.35);
      }

      html {
        scroll-behavior: smooth;
      }
      
      body {
        font-family: 'Pretendard Variable', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        background-color: var(--background);
        color: var(--foreground);
        font-feature-settings: 'ss01' on, 'cv01' on;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      
      /* Custom Scrollbar - Refined */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 100px;
        border: 3px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--muted-foreground);
        border: 3px solid transparent;
        background-clip: padding-box;
      }

      /* Selection styling */
      ::selection {
        background: var(--primary);
        color: var(--primary-foreground);
      }

      /* Shake Animation */
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
        20%, 40%, 60%, 80% { transform: translateX(5px); }
      }
      .animate-shake {
        animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
      }
      
      /* Glow Animation */
      @keyframes glow-pulse {
        0%, 100% { box-shadow: var(--shadow-glow); }
        50% { box-shadow: 0 0 35px -5px var(--ring); }
      }
      
      /* Gradient Text */
      .text-gradient {
        background: linear-gradient(135deg, var(--primary), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      /* Glass Effect */
      .glass {
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
      }
      
      /* Subtle Grid Pattern */
      .bg-grid-pattern {
        background-image: 
          linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 40px 40px;
        background-position: -1px -1px;
      }
      
      /* Noise texture overlay */
      .noise-overlay::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.015;
        pointer-events: none;
        z-index: 0;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
